<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file: https: http:">
<title>Markdown Viewer</title>
<link rel="stylesheet" href="vendor/github-markdown.css">
<link rel="stylesheet" href="vendor/highlight-github.css" data-code-theme="light">
<link rel="stylesheet" href="vendor/highlight-github-dark.css" data-code-theme="dark" disabled>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">
        <span class="icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"/></svg></span>
        <span id="dir-name">文件树</span>
      </div>
      <div class="sidebar-actions">
        <button id="btn-dir" class="btn" title="打开文件夹 (⌘O)">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"/></svg>
          打开文件夹
        </button>
        <button id="btn-collapse" class="btn btn-icon" title="收起全部">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3.72 6.72a.75.75 0 0 1 0-1.06l3.5-3.5a.75.75 0 0 1 1.06 0l3.5 3.5a.75.75 0 0 1-1.06 1.06L8 3.81 4.78 6.72a.75.75 0 0 1-1.06 0Z"/><path d="M3.72 9.28a.75.75 0 0 1 1.06 0L8 12.19l3.22-2.91a.75.75 0 0 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 0 1 0-1.06Z"/></svg>
        </button>
      </div>
      <div class="sort-row">
        <select id="sort-select" title="文件树排序方式">
          <option value="name">按名称排序</option>
          <option value="mtime">按修改时间排序</option>
        </select>
        <button id="sort-dir" class="btn btn-icon" title="当前：正序，点击切换倒序">↑</button>
      </div>
    </div>
    <div id="tree" tabindex="0"></div>
  </aside>
  <main id="content">
    <div id="content-head">
      <button id="btn-open" class="btn" title="打开 Markdown 文件">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></svg>
        打开文件
      </button>
      <span id="file-path" title=""></span>
      <div class="content-actions">
        <span id="file-title" hidden></span>
        <button id="btn-edit" class="btn" title="编辑模式（左右分屏）" disabled>
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474L7.293 12.27a.75.75 0 0 1-.35.204l-3.38.845a.75.75 0 0 1-.927-.927l.845-3.38a.75.75 0 0 1 .204-.35L11.013 1.427Z"/></svg>
          编辑
        </button>
        <button id="btn-save" class="btn" title="保存到原文件 (⌘S)" disabled>
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></svg>
          <span class="lbl">保存</span>
        </button>
        <button id="btn-toggle-tree" class="btn btn-icon" title="切换文件树 (⌘B)">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"/><path d="M0 5.5h4"/></svg>
        </button>
        <button id="btn-settings" class="btn btn-icon" title="外观设置">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 1.5a6.5 6.5 0 1 1-6.48 7.2.75.75 0 0 1 1.47-.3A5 5 0 1 0 8 3a.75.75 0 0 1 0 1.5H4.75a.75.75 0 0 1 0-1.5h1.9A6.48 6.48 0 0 1 8 1.5Z"/></svg>
        </button>
      </div>
    </div>
    <div id="tab-bar">
      <div id="tabs"></div>
    </div>
    <div id="doc-container">
      <div id="find-bar" hidden>
        <input id="find-input" type="text" placeholder="在文档中查找…" spellcheck="false">
        <span id="find-count">0/0</span>
        <button id="find-prev" class="btn btn-icon" title="上一个 (⇧Enter)">▲</button>
        <button id="find-next" class="btn btn-icon" title="下一个 (Enter)">▼</button>
        <button id="find-close" class="btn btn-icon" title="关闭 (Esc)">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 0 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 0 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
        </button>
      </div>
      <div id="editor-pane" hidden>
        <div id="editor-toolbar">
          <span class="tb-group">
            <button class="tb-btn" data-cmd="undo" title="撤销 (⌘Z)">↩</button>
            <button class="tb-btn" data-cmd="redo" title="重做 (⌘⇧Z)">↪</button>
          </span>
          <span class="tb-sep"></span>
          <span class="tb-group">
            <button class="tb-btn" data-cmd="bold" title="加粗 (⌘B)"><b>B</b></button>
            <button class="tb-btn" data-cmd="italic" title="斜体 (⌘I)"><i>I</i></button>
            <button class="tb-btn" data-cmd="strike" title="删除线"><s>S</s></button>
          </span>
          <span class="tb-sep"></span>
          <span class="tb-group">
            <button class="tb-btn" data-cmd="h2" title="二级标题">H2</button>
            <button class="tb-btn" data-cmd="h3" title="三级标题">H3</button>
            <button class="tb-btn" data-cmd="h4" title="四级标题">H4</button>
            <span class="tb-drop">
              <button class="tb-btn tb-drop-trigger" title="其他标题">H*<span class="caret">▾</span></button>
              <span class="tb-menu">
                <button class="tb-menu-item" data-cmd="h1">H1 一级标题</button>
                <button class="tb-menu-item" data-cmd="h5">H5 五级标题</button>
                <button class="tb-menu-item" data-cmd="h6">H6 六级标题</button>
              </span>
            </span>
          </span>
          <span class="tb-sep"></span>
          <span class="tb-group">
            <button class="tb-btn" data-cmd="link" title="链接">🔗</button>
            <button class="tb-btn" data-cmd="image" title="图片">🖼</button>
            <span class="tb-drop">
              <button class="tb-btn tb-drop-trigger" title="插入表格">⊞<span class="caret">▾</span></button>
              <div class="tb-menu tb-menu-grid">
                <div class="table-grid">
                  <div class="grid-cells" id="table-grid-cells"></div>
                  <div class="grid-size">0 × 0</div>
                </div>
                <div class="tb-menu-sep"></div>
                <div class="tb-menu-subtitle">表格操作</div>
                <button class="tb-menu-item" data-cmd="table-row-above">↑ 插入行（上方）</button>
                <button class="tb-menu-item" data-cmd="table-row-below">↓ 插入行（下方）</button>
                <button class="tb-menu-item" data-cmd="table-col-left">← 插入列（左侧）</button>
                <button class="tb-menu-item" data-cmd="table-col-right">→ 插入列（右侧）</button>
              </div>
            </span>
            <span class="tb-drop">
              <button class="tb-btn tb-drop-trigger" title="更多插入">+<span class="caret">▾</span></button>
              <span class="tb-menu">
                <button class="tb-menu-item" data-cmd="hr">── 分割线</button>
                <button class="tb-menu-item" data-cmd="quote">❝ 引用</button>
                <button class="tb-menu-item" data-cmd="comment"><span style="color:var(--muted)">&lt;!-- 注释 --&gt;</span></button>
              </span>
            </span>
          </span>
          <span class="tb-sep"></span>
          <span class="tb-group">
            <button class="tb-btn" data-cmd="ul" title="无序列表">*</button>
            <button class="tb-btn" data-cmd="ol" title="有序列表">1.</button>
            <span class="tb-drop">
              <button class="tb-btn tb-drop-trigger" title="更多列表">⋯<span class="caret">▾</span></button>
              <span class="tb-menu">
                <button class="tb-menu-item" data-cmd="task">☐ 任务列表</button>
                <span class="tb-menu-sep"></span>
                <button class="tb-menu-item" data-cmd="indent">→ 缩进</button>
                <button class="tb-menu-item" data-cmd="outdent">← 取消缩进</button>
              </span>
            </span>
          </span>
          <span class="tb-sep"></span>
          <span class="tb-group">
            <span class="tb-drop align-right">
              <button class="tb-btn tb-drop-trigger" data-cmd="code" title="代码 (行内/代码块)">&lt;/&gt;<span class="caret">▾</span></button>
              <span class="tb-menu">
                <button class="tb-menu-item" data-cmd="code">`code` 行内代码</button>
                <span class="tb-menu-sep"></span>
                <button class="tb-menu-item" data-cmd="codeblock" data-lang="js">```js JavaScript</button>
                <button class="tb-menu-item" data-cmd="codeblock" data-lang="py">```py Python</button>
                <button class="tb-menu-item" data-cmd="codeblock" data-lang="java">```java Java</button>
                <button class="tb-menu-item" data-cmd="codeblock" data-lang="json">```json JSON</button>
                <button class="tb-menu-item" data-cmd="codeblock" data-lang="md">```md Markdown</button>
                <button class="tb-menu-item" data-cmd="codeblock" data-lang="txt">```txt 纯文本</button>
              </span>
            </span>
          </span>
          <span class="tb-sep"></span>
          <span class="tb-group">
            <button class="tb-btn" id="tb-mode-toggle" title="切换到源码模式">源码</button>
          </span>
        </div>
        <div id="wysiwyg" class="markdown-body" contenteditable="true" spellcheck="false" hidden></div>
        <textarea id="editor" spellcheck="false" placeholder="在左侧编辑 Markdown，右侧实时预览"></textarea>
      </div>
      <div id="divider" title="拖动调整左右宽度"></div>
      <article id="doc" class="markdown-body" hidden></article>
      <div id="empty">
        <div class="empty-icon">
          <svg viewBox="0 0 1024 1024" width="72" height="72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4dabff"/>
                <stop offset="1" stop-color="#0861c9"/>
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" rx="232" fill="url(#logo-bg)"/>
            <g transform="translate(54.3 239.5) scale(4.258)" fill="#ffffff">
              <path d="M30 98v-68h20l20 27 20-27h20v68h-19v-41l-21 28-21-28v41z"/>
              <path d="M155 98l-30-33h20V30h19v35h20z"/>
            </g>
          </svg>
        </div>
        <h2>Markdown Viewer</h2>
        <p>把 <code>.md</code> 文件拖进来，或点击上方「打开文件」。</p>
        <p>把目录拖进来，即可在左侧浏览整个项目。</p>
      </div>
    </div>
  </main>
</div>

<div id="settings-panel" hidden>
  <div class="settings-head">
    <h3>外观定制</h3>
    <button id="btn-close-settings" class="btn btn-icon" title="关闭">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 0 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 0 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
    </button>
  </div>

  <label>主题
    <select id="set-theme">
      <option value="light">浅色</option>
      <option value="dark">深色</option>
    </select>
  </label>
  <label>字体大小 <input id="set-fontsize" type="range" min="12" max="22" step="1"></label>
  <label>内容宽度 <input id="set-width" type="range" min="480" max="1200" step="20"></label>
  <label>自定义 CSS 文件
    <input id="set-cssfile" type="file" accept=".css">
  </label>
  <div id="cssfile-name" hidden></div>
  <button id="btn-reset">恢复默认</button>
</div>

<div id="drop-overlay" hidden>松开鼠标打开文件 / 文件夹</div>

<div id="diagram-modal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-box">
    <div class="modal-head">
      <span>Mermaid 图 · 滚轮缩放 · 拖动平移</span>
      <div class="modal-actions">
        <button id="zoom-out" class="btn btn-icon" title="缩小">−</button>
        <button id="zoom-in" class="btn btn-icon" title="放大">+</button>
        <button id="zoom-fit" class="btn" title="适应窗口">适应</button>
        <button id="btn-close-modal" class="btn btn-icon" title="关闭 (Esc)">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 0 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 0 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
        </button>
      </div>
    </div>
    <div class="modal-body"><div id="diagram-zoom"></div></div>
  </div>
</div>

<div id="about-modal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-box about-box">
    <div class="modal-head">
      <span>关于 Markdown Viewer</span>
      <button id="btn-close-about" class="btn btn-icon" title="关闭 (Esc)">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 0 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 0 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
      </button>
    </div>
    <div class="about-body">
      <div class="about-logo">
        <svg viewBox="0 0 1024 1024" width="64" height="64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="about-logo-bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4dabff"/>
              <stop offset="1" stop-color="#0861c9"/>
            </linearGradient>
          </defs>
          <rect width="1024" height="1024" rx="232" fill="url(#about-logo-bg)"/>
          <g transform="translate(54.3 239.5) scale(4.258)" fill="#ffffff">
            <path d="M30 98v-68h20l20 27 20-27h20v68h-19v-41l-21 28-21-28v41z"/>
            <path d="M155 98l-30-33h20V30h19v35h20z"/>
          </g>
        </svg>
      </div>
      <h3>Markdown Viewer</h3>
      <p>版本 <span id="about-version">-</span></p>
      <p>开发者：<b>Layne Peng</b></p>
      <p>项目 GitHub：<a id="about-github" href="#" title="https://github.com/LaynePeng/markdown-viewer"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>LaynePeng/markdown-viewer</a></p>
      <div class="about-actions">
        <button id="btn-about-github" class="btn">打开 GitHub</button>
        <button id="btn-associate-files" class="btn" title="将 .md / .markdown / .mdown / .mkd 默认用 Markdown Viewer 打开">关联 Markdown 文件</button>
      </div>
      <p id="associate-status" class="associate-status" hidden></p>
    </div>
  </div>
</div>

<script src="vendor/marked.umd.js"></script>
<script src="vendor/turndown.js"></script>
<script src="vendor/turndown-plugin-gfm.js"></script>
<script src="hljs.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script src="app.js"></script>
</body>
</html>
