name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-viewer-windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash tools/build-macos.sh --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-viewer-macos-arm64
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: 生成 Release Notes（版本号取自 tag）
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          sed "s/{{VERSION}}/${VER}/g" RELEASE_NOTES.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          body_path: release-notes.md